  <rect x="260" y="82" width="40" height="16" fill="#dcfce7" rx="3"/>
  <text x="280" y="93" fill="#166534" font-size="9" text-anchor="middle">88</text>
  <rect x="310" y="82" width="40" height="16" fill="#dcfce7" rx="3"/>
  <text x="330" y="93" fill="#166534" font-size="9" text-anchor="middle">95</text>
  
  <!-- 数据行2 -->
  <line x1="20" y1="110" x2="380" y2="110" stroke="#f1f5f9" stroke-width="1"/>
  <text x="35" y="106" fill="#334155" font-size="9">2</text>
  <text x="70" y="106" fill="#334155" font-size="9">李小红</text>
  <text x="150" y="106" fill="#334155" font-size="9">高一(1)</text>
  <rect x="210" y="98" width="40" height="16" fill="#fef3c7" rx="3"/>
  <text x="230" y="109" fill="#92400e" font-size="9" text-anchor="middle">78</text>
  <rect x="260" y="98" width="40" height="16" fill="#dcfce7" rx="3"/>
  <text x="280" y="109" fill="#166534" font-size="9" text-anchor="middle">91</text>
  <rect x="310" y="98" width="40" height="16" fill="#dcfce7" rx="3"/>
  <text x="330" y="109" fill="#166534" font-size="9" text-anchor="middle">89</text>
  
  <!-- 数据行3 -->
  <text x="35" y="122" fill="#334155" font-size="9">3</text>
  <text x="70" y="122" fill="#334155" font-size="9">张大力</text>
  <text x="150" y="122" fill="#334155" font-size="9">高一(2)</text>
  <rect x="210" y="114" width="40" height="16" fill="#dcfce7" rx="3"/>
  <text x="230" y="125" fill="#166534" font-size="9" text-anchor="middle">85</text>
  <rect x="260" y="114" width="40" height="16" fill="#fef3c7" rx="3"/>
