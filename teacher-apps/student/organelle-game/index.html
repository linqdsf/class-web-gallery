<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>细胞器功能配对游戏 - 高中生物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0,0,0,0.2);
            padding: 20px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon {
            font-size: 1.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .game-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .column {
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .column-title {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #e9d5ff;
        }

        .items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item {
            padding: 15px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .item.selected {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.2);
        }

        .item.matched {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.3);
            cursor: default;
        }

        .item.wrong {
            border-color: #ef4444;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .item-icon {
            font-size: 1.8rem;
        }

        .item-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(251, 191, 36, 0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .level-select {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .level-btn {
            padding: 10px 25px;
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .level-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .level-btn.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.2);
        }

        .timer {
            font-size: 1.2rem;
            color: #fbbf24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .modal h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .modal p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .stars {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 细胞器功能配对游戏</h1>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-icon">⭐</span>
                <div>
                    <div class="stat-value" id="scoreValue">0</div>
                    <div class="stat-label">得分</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⏱️</span>
                <div>
                    <div class="stat-value timer" id="timerValue">60</div>
                    <div class="stat-label">剩余秒数</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🔥</span>
                <div>
                    <div class="stat-value" id="comboValue">0</div>
                    <div class="stat-label">连击</div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="level-select">
            <button class="level-btn active" data-level="1">入门</button>
            <button class="level-btn" data-level="2">进阶</button>
            <button class="level-btn" data-level="3">挑战</button>
        </div>

        <div class="card">
            <div class="game-area">
                <div class="column">
                    <div class="column-title">🧫 细胞器</div>
                    <div class="items" id="organelleColumn"></div>
                </div>
                <div class="column">
                    <div class="column-title">📝 功能</div>
                    <div class="items" id="functionColumn"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="newGameBtn">🎮 开始游戏</button>
                <button class="btn btn-secondary" id="hintBtn">💡 提示</button>
            </div>
        </div>
    </div>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <h2 id="modalTitle">恭喜通关!</h2>
            <div class="stars" id="modalStars">⭐⭐⭐</div>
            <p id="modalText">你的得分: 100</p>
            <button class="btn btn-primary" id="playAgainBtn">再玩一次</button>
        </div>
    </div>

    <script>
        const organelleData = [
            { id: 1, icon: '🏭', name: '线粒体', function: '有氧呼吸的主要场所，产生ATP能量', short: '能量工厂' },
            { id: 2, icon: '🌿', name: '叶绿体', function: '光合作用的场所，将光能转化为化学能', short: '光合作用' },
            { id: 3, icon: '🏛️', name: '细胞核', function: '遗传信息库，控制细胞代谢和遗传', short: '遗传控制' },
            { id: 4, icon: '📦', name: '内质网', function: '蛋白质合成和加工，脂质代谢', short: '加工合成' },
            { id: 5, icon: '🔬', name: '核糖体', function: '蛋白质合成的场所，氨基酸脱水缩合', short: '蛋白质合成' },
            { id: 6, icon: '🧫', name: '高尔基体', function: '蛋白质加工、包装和运输，分泌形成', short: '包装运输' },
            { id: 7, icon: '💧', name: '液泡', function: '储存物质，调节细胞渗透压', short: '储存调节' },
            { id: 8, icon: '⚡', name: '中心体', function: '与细胞有丝分裂有关，形成纺锤体', short: '有丝分裂' },
            { id: 9, icon: '🧹', name: '溶酶体', function: '分解衰老损伤的细胞器，消化异物', short: '分解消化' },
            { id: 10, icon: '🔗', name: '细胞膜', function: '控制物质进出细胞，进行信息交流', short: '控制交流' }
        ];

        let currentLevel = 1;
        let score = 0;
        let combo = 0;
        let timer = 60;
        let timerInterval = null;
        let selectedOrganelle = null;
        let selectedFunction = null;
        let matchedPairs = [];
        let isPlaying = false;

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            const numPairs = currentLevel === 1 ? 5 : currentLevel === 2 ? 7 : 10;
            const data = shuffle(organelleData).slice(0, numPairs);
            
            matchedPairs = [];
            selectedOrganelle = null;
            selectedFunction = null;
            score = 0;
            combo = 0;
            timer = currentLevel === 1 ? 90 : currentLevel === 2 ? 75 : 60;
            
            document.getElementById('scoreValue').textContent = '0';
            document.getElementById('comboValue').textContent = '0';
            document.getElementById('timerValue').textContent = timer;

            const organelleColumn = document.getElementById('organelleColumn');
            const functionColumn = document.getElementById('functionColumn');

            organelleColumn.innerHTML = '';
            functionColumn.innerHTML = '';

            const shuffledFunctions = shuffle(data.map(d => ({ id: d.id, text: d.function })));
            const shuffledOrganelles = shuffle(data);

            shuffledOrganelles.forEach(o => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.id = o.id;
                div.dataset.type = 'organelle';
                div.innerHTML = `
                    <span class="item-icon">${o.icon}</span>
                    <span class="item-text">${o.name}</span>
                `;
                div.addEventListener('click', () => selectItem(div, 'organelle', o.id));
                organelleColumn.appendChild(div);
            });

            shuffledFunctions.forEach(f => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.id = f.id;
                div.dataset.type = 'function';
                div.innerHTML = `<span class="item-text">${f.text}</span>`;
                div.addEventListener('click', () => selectItem(div, 'function', f.id));
                functionColumn.appendChild(div);
            });

            isPlaying = true;
            startTimer();
        }

        function selectItem(element, type, id) {
            if (!isPlaying || element.classList.contains('matched')) return;

            // 清除选中状态
            document.querySelectorAll('.item').forEach(i => i.classList.remove('selected'));

            element.classList.add('selected');

            if (type === 'organelle') {
                selectedOrganelle = { element, id };
            } else {
                selectedFunction = { element, id };
            }

            // 检查匹配
            if (selectedOrganelle && selectedFunction) {
                if (selectedOrganelle.id === selectedFunction.id) {
                    // 正确匹配
                    selectedOrganelle.element.classList.remove('selected');
                    selectedOrganelle.element.classList.add('matched');
                    selectedFunction.element.classList.add('matched');
                    
                    combo++;
                    const points = 10 * combo;
                    score += points;

                    document.getElementById('scoreValue').textContent = score;
                    document.getElementById('comboValue').textContent = combo;

                    matchedPairs.push(selectedOrganelle.id);

                    // 检查是否全部完成
                    const totalPairs = parseInt(document.querySelector('.level-btn.active').dataset.level) === 1 ? 5 :
                                     parseInt(document.querySelector('.level-btn.active').dataset.level) === 2 ? 7 : 10;
                    
                    if (matchedPairs.length === totalPairs) {
                        endGame(true);
                    }

                    selectedOrganelle = null;
                    selectedFunction = null;
                } else {
                    // 错误
                    selectedOrganelle.element.classList.add('wrong');
                    selectedFunction.element.classList.add('wrong');
                    combo = 0;
                    document.getElementById('comboValue').textContent = '0';

                    setTimeout(() => {
                        selectedOrganelle?.element?.classList.remove('wrong', 'selected');
                        selectedFunction?.element?.classList.remove('wrong', 'selected');
                        selectedOrganelle = null;
                        selectedFunction = null;
                    }, 500);
                }
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timerValue').textContent = timer;
                
                if (timer <= 10) {
                    document.getElementById('timerValue').style.color = '#ef4444';
                }

                if (timer <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function endGame(won) {
            isPlaying = false;
            clearInterval(timerInterval);

            const modal = document.getElementById('gameModal');
            const stars = won ? Math.min(3, Math.floor(score / 50) + 1) : 0;

            document.getElementById('modalIcon').textContent = won ? '🎉' : '😢';
            document.getElementById('modalTitle').textContent = won ? '恭喜通关!' : '时间到!';
            document.getElementById('modalStars').textContent = '⭐'.repeat(stars);
            document.getElementById('modalText').textContent = `你的得分: ${score}`;

            modal.classList.add('show');
        }

        function showHint() {
            if (!isPlaying) return;

            const totalPairs = currentLevel === 1 ? 5 : currentLevel === 2 ? 7 : 10;
            const unmatched = organelleData.slice(0, totalPairs).filter(o => !matchedPairs.includes(o.id));
            
            if (unmatched.length > 0) {
                const hint = unmatched[Math.floor(Math.random() * unmatched.length)];
                alert(`💡 提示: ${hint.name} 的功能是 "${hint.short}"`);
                score = Math.max(0, score - 5);
                document.getElementById('scoreValue').textContent = score;
            }
        }

        // 事件监听
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLevel = parseInt(btn.dataset.level);
            });
        });

        document.getElementById('newGameBtn').addEventListener('click', initGame);
        document.getElementById('hintBtn').addEventListener('click', showHint);
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            document.getElementById('gameModal').classList.remove('show');
            initGame();
        });

        // 初始化显示
        initGame();
    </script>
</body>
</html>
