<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- DNA helix representation -->
  <g transform="translate(200, 150)">
    <!-- Left backbone -->
    <path d="M-60,0 Q-80,-60 -40,-100" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round"/>
    <path d="M-40,-100 Q0,-140 40,-100" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round"/>
    <path d="M40,-100 Q80,-60 60,0" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round"/>
    <path d="M60,0 Q80,60 40,100" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round"/>
    <path d="M40,100 Q0,140 -40,100" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round"/>
    <path d="M-40,100 Q-80,60 -60,0" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right backbone -->
    <path d="M60,0 Q80,-60 40,-100" fill="none" stroke="#8b9dc3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M40,-100 Q-0,-140 -40,-100" fill="none" stroke="#8b9dc3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-40,-100 Q-80,-60 -60,0" fill="none" stroke="#8b9dc3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-60,0 Q-80,60 -40,100" fill="none" stroke="#8b9dc3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-40,100 Q0,140 40,100" fill="none" stroke="#8b9dc3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M40,100 Q80,60 60,0" fill="none" stroke="#8b9dc3" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Base pairs (rungs) -->
    <line x1="-70" y1="-10" x2="70" y2="-10" stroke="#ff6b6b" stroke-width="3" opacity="0.8"/>
    <line x1="-55" y1="-55" x2="55" y2="-55" stroke="#60a5fa" stroke-width="3" opacity="0.8"/>
    <line x1="-10" y1="-85" x2="10" y2="-85" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    <line x1="55" y1="-55" x2="-55" y2="-55" stroke="#f7dc6f" stroke-width="3" opacity="0.8"/>
    <line x1="70" y1="-10" x2="-70" y2="-10" stroke="#ff6b6b" stroke-width="3" opacity="0.8"/>
    <line x1="55" y1="40" x2="-55" y2="40" stroke="#60a5fa" stroke-width="3" opacity="0.8"/>
    
    <!-- Nucleotide bases (circles) -->
    <circle cx="-70" cy="-10" r="8" fill="#ff6b6b"/>
    <circle cx="70" cy="-10" r="8" fill="#4ecdc4"/>
    <circle cx="-55" cy="-55" r="8" fill="#60a5fa"/>
    <circle cx="55" cy="-55" r="8" fill="#f7dc6f"/>
    <circle cx="-10" cy="-85" r="8" fill="#4ecdc4"/>
    <circle cx="10" cy="-85" r="8" fill="#ff6b6b"/>
    <circle cx="55" cy="40" r="8" fill="#f7dc6f"/>
    <circle cx="-55" cy="40" r="8" fill="#60a5fa"/>
    <circle cx="-70" cy="75" r="8" fill="#ff6b6b"/>
    <circle cx="70" cy="75" r="8" fill="#4ecdc4"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="265" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" font-weight="bold">DNA双螺旋构建器</text>
  
  <!-- DNA icon -->
  <text x="200" y="30" text-anchor="middle" fill="#60a5fa" font-size="24">🧬</text>
</svg>