<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1445"/>
      <stop offset="100%" style="stop-color:#1a237e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="15"/>

  <!-- 标题 -->
  <text x="200" y="35" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Microsoft YaHei">DNA双螺旋构建器</text>

  <!-- DNA双螺旋3D效果 -->
  <g transform="translate(200, 160)">
    <!-- 外层螺旋 -->
    <ellipse cx="0" cy="-60" rx="80" ry="30" fill="none" stroke="rgba(231,76,60,0.3)" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="80" ry="30" fill="none" stroke="rgba(231,76,60,0.5)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="rgba(231,76,60,0.7)" stroke-width="2"/>
    <ellipse cx="0" cy="30" rx="80" ry="30" fill="none" stroke="rgba(231,76,60,0.9)" stroke-width="2"/>
    <ellipse cx="0" cy="60" rx="80" ry="30" fill="none" stroke="rgba(231,76,60,0.7)" stroke-width="2"/>
    
    <!-- 另一条链 -->
    <ellipse cx="0" cy="-60" rx="80" ry="30" fill="none" stroke="rgba(52,152,219,0.3)" stroke-width="2" stroke-dasharray="20,10"/>
    <ellipse cx="0" cy="-30" rx="80" ry="30" fill="none" stroke="rgba(52,152,219,0.5)" stroke-width="2" stroke-dasharray="20,10"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="rgba(52,152,219,0.7)" stroke-width="2" stroke-dasharray="20,10"/>
    <ellipse cx="0" cy="30" rx="80" ry="30" fill="none" stroke="rgba(52,152,219,0.9)" stroke-width="2" stroke-dasharray="20,10"/>
    <ellipse cx="0" cy="60" rx="80" ry="30" fill="none" stroke="rgba(52,152,219,0.7)" stroke-width="2" stroke-dasharray="20,10"/>

    <!-- 碱基对 A-T -->
    <g transform="translate(-60, -45)">
      <rect x="0" y="-8" width="15" height="16" rx="2" fill="#e74c3c"/>
      <text x="7" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">A</text>
      <line x1="15" y1="0" x2="45" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="45" y="-8" width="15" height="16" rx="2" fill="#3498db"/>
      <text x="52" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">T</text>
    </g>

    <!-- 碱基对 G-C -->
    <g transform="translate(-60, 0)">
      <rect x="0" y="-8" width="15" height="16" rx="2" fill="#2ecc71"/>
      <text x="7" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">G</text>
      <line x1="15" y1="0" x2="45" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="45" y="-8" width="15" height="16" rx="2" fill="#f39c12"/>
      <text x="52" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">C</text>
    </g>

    <!-- 碱基对 A-T -->
    <g transform="translate(-60, 45)">
      <rect x="0" y="-8" width="15" height="16" rx="2" fill="#e74c3c"/>
      <text x="7" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">T</text>
      <line x1="15" y1="0" x2="45" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="45" y="-8" width="15" height="16" rx="2" fill="#3498db"/>
      <text x="52" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">A</text>
    </g>
  </g>

  <!-- 底部标签 -->
  <g transform="translate(200, 260)">
    <rect x="-120" y="-15" width="80" height="30" rx="15" fill="rgba(231,76,60,0.3)" stroke="#e74c3c"/>
    <text x="-80" y="5" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">半保留复制</text>
    
    <text x="20" y="5" text-anchor="middle" fill="white" font-size="16">+</text>
    
    <rect x="40" y="-15" width="80" height="30" rx="15" fill="rgba(52,152,219,0.3)" stroke="#3498db"/>
    <text x="80" y="5" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">3D可视化</text>
  </g>

  <!-- DNA图标 -->
  <text x="370" y="30" text-anchor="middle" font-size="24">🧬</text>
</svg>
