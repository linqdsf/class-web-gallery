<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% seo %}
</head>
<body class="gradient-bg">
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="logo">
                <span class="logo-icon">🎨</span>
                <span class="logo-text">{{ site.title }}</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="切换菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="{{ '/' | relative_url }}" class="nav-link">首页</a></li>
                <li><a href="{{ '/browse/' | relative_url }}" class="nav-link">浏览</a></li>
                <li><a href="{{ '/submit/' | relative_url }}" class="nav-link nav-highlight">我要投稿</a></li>
                <li><a href="{{ '/about/' | relative_url }}" class="nav-link">关于</a></li>
            </ul>
        </div>
    </nav>
    <main class="main-content">
        {{ content }}
    </main>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">🎨 {{ site.title }}</span>
                    <p class="footer-desc">{{ site.description }}</p>
                </div>
                <div class="footer-links">
                    <h4>快速链接</h4>
                    <ul>
                        <li><a href="{{ '/' | relative_url }}">首页</a></li>
                        <li><a href="{{ '/browse/' | relative_url }}">浏览作品</a></li>
                        <li><a href="{{ '/submit/' | relative_url }}">投稿指南</a></li>
                    </ul>
                </div>
                <div class="footer-links">
                    <h4>参与贡献</h4>
                    <ul>
                        <li><a href="{{ site.github_url }}" target="_blank">GitHub</a></li>
                        <li><a href="{{ site.github_url }}/issues" target="_blank">提交Issue</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>Made with ❤️ by 教育者们 | Powered by GitHub Pages</p>
            </div>
        </div>
    </footer>
    <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
