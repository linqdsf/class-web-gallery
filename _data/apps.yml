  - id: teacher-001
    title: 数学可视化工具
    slug: math-visualizer
    author: 李明老师
    author_avatar: https://api.dicebear.com/7.x/avataaars/svg?seed=teacher1
    school: 第一中学
    school_icon: 🏫
    category: teacher
    description: 一个交互式的数学函数可视化工具，支持绘制各种数学函数图像，动态展示函数变换过程。
    long_description: |
      本工具旨在帮助数学教师在课堂上进行函数教学的演示。学生可以通过拖动参数滑块，
      实时观察函数图像的变化，加深对函数性质的理解。支持正弦、余弦、正切等三角函数，
      以及二次函数、指对数函数等多种常见函数类型。
    url: https://example.com/math-visualizer
    repo: https://github.com/school/math-visualizer
    tags: [数学, 可视化, 教学工具]
    thumbnail: /assets/thumbnails/math-visualizer.png
    features:
      - 支持20+种数学函数
      - 实时参数调节
      - 导出图像为PNG
      - 响应式设计
    tech_stack: [JavaScript, Canvas API, Math.js]
    date: 2024-03-15
    featured: true
    likes: 128
    views: 2340
    status: published

