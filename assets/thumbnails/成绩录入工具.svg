  <text x="320" y="72" fill="#64748b" font-size="9">英语</text>
  
  <!-- 数据行1 -->
  <line x1="20" y1="95" x2="380" y2="95" stroke="#f1f5f9" stroke-width="1"/>
  <text x="35" y="90" fill="#334155" font-size="9">1</text>
  <text x="70" y="90" fill="#334155" font-size="9">王小明</text>
  <text x="150" y="90" fill="#334155" font-size="9">高一(1)</text>
  <rect x="210" y="82" width="40" height="16" fill="#dcfce7" rx="3"/>
