  <text x="20" y="26" fill="white" font-size="14" font-weight="600">智慧成绩管理系统</text>
  <circle cx="370" cy="20" r="5" fill="#4ade80"/>
  <circle cx="355" cy="20" r="5" fill="#fbbf24"/>
  <circle cx="340" cy="20" r="5" fill="#f87171"/>
  
  <!-- 表格区域 -->
  <rect x="20" y="55" width="360" height="120" fill="white" rx="4"/>
  
  <!-- 表头 -->
  <rect x="20" y="55" width="360" height="24" fill="#e2e8f0" rx="4"/>
  <rect x="20" y="71" width="360" height="8" fill="#e2e8f0"/>
