<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a0f"/>
      <stop offset="100%" style="stop-color:#1a2f1a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGrad3)" rx="15"/>

  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Orbitron">光合作用实验平台</text>

  <!-- 左侧：植物 -->
  <g transform="translate(80, 150)">
    <!-- 茎 -->
    <path d="M0,-50 Q-5,0 0,50" stroke="#4a7c43" stroke-width="6" fill="none"/>
    <!-- 叶子 -->
    <ellipse cx="-25" cy="-20" rx="20" ry="12" fill="#22c55e" transform="rotate(-30 -25 -20)"/>
    <ellipse cx="25" cy="0" rx="20" ry="12" fill="#4ade80" transform="rotate(30 25 0)"/>
    <ellipse cx="-20" cy="20" rx="18" ry="10" fill="#22c55e" transform="rotate(-20 -20 20)"/>
    <!-- 气泡 -->
    <circle cx="-10" cy="-30" r="4" fill="rgba(255,255,255,0.6)"/>
    <circle cx="5" cy="-15" r="3" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- 右侧：控制面板 -->
  <g transform="translate(180, 70)">
    <!-- 光照滑块 -->
    <text x="0" y="0" fill="#f59e0b" font-size="10" font-family="Microsoft YaHei">光照强度</text>
    <rect x="0" y="8" width="150" height="8" rx="4" fill="#2d4a2d"/>
    <rect x="0" y="8" width="100" height="8" rx="4" fill="#f59e0b"/>
    <circle cx="100" cy="12" r="8" fill="#f59e0b"/>
    <text x="160" y="16" fill="#f59e0b" font-size="10" font-family="JetBrains Mono">800</text>

    <!-- CO2滑块 -->
    <text x="0" y="45" fill="#4ade80" font-size="10" font-family="Microsoft YaHei">CO₂浓度</text>
    <rect x="0" y="53" width="150" height="8" rx="4" fill="#2d4a2d"/>
    <rect x="0" y="53" width="45" height="8" rx="4" fill="#4ade80"/>
    <circle cx="45" cy="57" r="8" fill="#4ade80"/>
    <text x="160" y="61" fill="#4ade80" font-size="10" font-family="JetBrains Mono">400</text>

    <!-- 速率显示 -->
    <rect x="0" y="80" width="150" height="40" rx="8" fill="rgba(74,222,128,0.2)"/>
    <text x="75" y="98" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="bold" font-family="JetBrains Mono">67.8</text>
    <text x="75" y="112" text-anchor="middle" fill="#94a3b8" font-size="8">μmol CO₂/m²/s</text>
  </g>

  <!-- 底部：图表 -->
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="360" height="80" rx="8" fill="rgba(0,0,0,0.3)"/>
    <!-- 网格 -->
    <line x1="30" y1="10" x2="30" y2="70" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
    <line x1="30" y1="70" x2="350" y2="70" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
    <!-- 曲线 -->
    <path d="M30,65 Q80,55 130,40 T230,30 T330,25" stroke="#4ade80" stroke-width="2" fill="none"/>
    <path d="M30,65 Q80,55 130,40 T230,30 T330,25 L330,70 L30,70 Z" fill="url(#chartGrad)" opacity="0.3"/>
  </g>

  <!-- 标签 -->
  <text x="370" y="30" text-anchor="middle" font-size="20">🌿</text>
</svg>
