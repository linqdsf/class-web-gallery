<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>细胞分裂3D可视化 - 有丝分裂与减数分裂</title>
    <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <script>
        // WebGL支持检测
        (function() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) {
                    document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a2e;color:#fff;font-family:sans-serif;text-align:center;padding:20px;"><div><h1>⚠️ WebGL 未启用</h1><p>请在浏览器设置中启用 WebGL，或尝试使用 Chrome/Firefox 最新版本</p></div></div>';
                }
            } catch(e) {
                console.error('WebGL检测失败:', e);
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* 顶部标题栏 */
        .header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .badge {
            background: rgba(102, 126, 234, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            position: relative;
        }
        /* 3D画布 */
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #canvas-container canvas {
            display: block;
        }
        /* 3D提示 */
        .rotate-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        /* 左侧控制面板 */
        .control-panel {
            width: 280px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .panel-section {
            margin-bottom: 25px;
        }
        .panel-title {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* 分裂类型切换 */
        .type-switch {
            display: flex;
            gap: 10px;
        }
        .type-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .type-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
        }
        .type-btn:hover:not(.active) {
            border-color: #667eea;
        }
        /* 阶段选择 */
        .phase-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .phase-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .phase-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .phase-item.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .phase-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .phase-item.active .phase-num {
            background: #667eea;
        }
        .phase-info {
            flex: 1;
        }
        .phase-name {
            font-size: 0.95rem;
            margin-bottom: 3px;
        }
        .phase-desc {
            font-size: 0.75rem;
            color: #888;
        }
        /* 播放控制 */
        .playback-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .control-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .play-btn {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }
        .play-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(72, 187, 120, 0.4);
        }
        .reset-btn {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .reset-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        /* 进度条 */
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
        }
        /* 速度控制 */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .speed-label {
            font-size: 0.85rem;
            min-width: 50px;
        }
        .speed-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }
        /* 视角预设 */
        .view-presets {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .view-btn {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .view-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: #667eea;
        }
        /* 颜色图例 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        /* 信息弹窗 */
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            max-width: 300px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .info-panel h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .info-panel p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ccc;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
        }
        /* 响应式 */
        @media (max-width: 900px) {
            .control-panel {
                width: 240px;
            }
        }
        @media (max-width: 700px) {
            .main-content {
                flex-direction: column;
            }
            .control-panel {
                width: 100%;
                max-height: 40vh;
                border-right: none;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
            .phase-list {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .phase-item {
                flex: 1 1 45%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🧬 细胞分裂3D可视化</h1>
            <div class="header-info">
                <span class="badge">Three.js 3D渲染</span>
                <span class="badge">WebGL 加速</span>
            </div>
        </header>
        
        <main class="main-content">
            <aside class="control-panel">
                <!-- 分裂类型 -->
                <div class="panel-section">
                    <div class="panel-title">分裂类型</div>
                    <div class="type-switch">
                        <button class="type-btn active" onclick="setDivisionType('mitosis')">有丝分裂</button>
                        <button class="type-btn" onclick="setDivisionType('meiosis')">减数分裂</button>
                    </div>
                </div>
                
                <!-- 阶段选择 -->
                <div class="panel-section">
                    <div class="panel-title" id="phase-title">有丝分裂阶段</div>
                    <div class="phase-list" id="phase-list">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <!-- 播放控制 -->
                <div class="panel-section">
                    <div class="panel-title">播放控制</div>
                    <div class="playback-controls">
                        <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()">▶ 播放</button>
                        <button class="control-btn reset-btn" onclick="resetAnimation()">⏮ 重置</button>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                        </div>
                        <div class="progress-text">
                            <span id="currentPhaseName">间期</span>
                            <span id="progressText">0%</span>
                        </div>
                    </div>
                </div>
                
                <!-- 动画速度 -->
                <div class="panel-section">
                    <div class="panel-title">动画速度</div>
                    <div class="speed-control">
                        <span class="speed-label">慢速</span>
                        <input type="range" class="speed-slider" min="0.1" max="3" step="0.1" value="1" id="speedSlider" oninput="setSpeed(this.value)">
                        <span class="speed-label">快速</span>
                    </div>
                </div>
                
                <!-- 视角预设 -->
                <div class="panel-section">
                    <div class="panel-title">视角预设</div>
                    <div class="view-presets">
                        <button class="view-btn" onclick="setCameraView('front')">正视图</button>
                        <button class="view-btn" onclick="setCameraView('top')">俯视图</button>
                        <button class="view-btn" onclick="setCameraView('side')">侧视图</button>
                        <button class="view-btn" onclick="setCameraView('iso')">等距视图</button>
                    </div>
                </div>
                
                <!-- 图例 -->
                <div class="panel-section">
                    <div class="panel-title">图例</div>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #e74c3c;"></div>
                            <span>染色体</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #3498db;"></div>
                            <span>纺锤丝</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: rgba(255,200,100,0.5);"></div>
                            <span>核膜</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: rgba(100,200,100,0.5);"></div>
                            <span>细胞膜</span>
                        </div>
                    </div>
                </div>
            </aside>
            
            <div id="canvas-container">
                <div class="rotate-hint">
                    🖱️ 拖拽旋转 | 滚轮缩放 | 右键平移
                </div>
                <div class="info-panel" id="infoPanel">
                    <button class="close-btn" onclick="hideInfo()">×</button>
                    <h3 id="infoTitle">间期</h3>
                    <p id="infoText">细胞处于分裂前的准备阶段，DNA进行复制，细胞适度生长。</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==================== 配置 ====================
        const mitosisPhases = [
            { 
                name: '间期', 
                shortName: 'G1/S/G2',
                desc: 'DNA复制准备',
                info: '细胞处于分裂前的准备阶段，DNA进行复制，细胞适度生长。染色体呈染色质状态，核膜完整。'
            },
            { 
                name: '前期', 
                shortName: 'Prophase',
                desc: '染色体凝缩',
                info: '染色体逐渐凝缩变粗，核膜开始解体，核仁逐渐消失。中心体发出星射线，形成纺锤体。'
            },
            { 
                name: '中期', 
                shortName: 'Metaphase',
                desc: '染色体排列',
                info: '所有染色体整齐排列在细胞中央的赤道板上。纺锤体完全形成，纺锤丝与着丝点相连。'
            },
            { 
                name: '后期', 
                shortName: 'Anaphase',
                desc: '姐妹分离',
                info: '着丝点分裂，姐妹染色单体分离，成为独立的染色体。在纺锤丝牵引下，两组染色体向两极移动。'
            },
            { 
                name: '末期', 
                shortName: 'Telophase',
                desc: '新核形成',
                info: '染色体到达两极，开始解旋恢复染色质状态。核膜重新形成，核仁重现。细胞膜开始凹陷。'
            },
            { 
                name: '胞质分裂', 
                shortName: 'Cytokinesis',
                desc: '细胞分裂',
                info: '细胞膜从赤道部位向内凹陷，最终缢裂成两个子细胞。每个子细胞获得一套完整的染色体。'
            }
        ];

        const meiosisPhases = [
            { 
                name: '间期', 
                shortName: 'Interphase',
                desc: 'DNA复制',
                info: '与有丝分裂间期相同，DNA进行复制，为减数分裂做准备。'
            },
            { 
                name: '减数分裂Ⅰ-前期', 
                shortName: 'Prophase I',
                desc: '同源联会',
                info: '同源染色体两两配对形成四分体，发生交叉互换。核膜解体，纺锤体形成。'
            },
            { 
                name: '减数分裂Ⅰ-中期', 
                shortName: 'Metaphase I',
                desc: '四分体排列',
                info: '四分体排列在赤道板上，但同源染色体不分开。纺锤丝与各着丝点相连。'
            },
            { 
                name: '减数分裂Ⅰ-后期', 
                shortName: 'Anaphase I',
                desc: '同源分离',
                info: '同源染色体分离，向两极移动。每极只得到每对同源染色体中的一条。'
            },
            { 
                name: '减数分裂Ⅰ-末期', 
                shortName: 'Telophase I',
                desc: '形成次级母细胞',
                info: '细胞分裂成两个次级精母细胞（或次级卵母细胞）。每极染色体数目减半。'
            },
            { 
                name: '减数分裂Ⅱ-前期', 
                shortName: 'Prophase II',
                desc: '准备第二次分裂',
                info: '两个子细胞各自形成新的纺锤体，染色体再次凝缩。'
            },
            { 
                name: '减数分裂Ⅱ-中期', 
                shortName: 'Metaphase II',
                desc: '着丝点排列',
                info: '染色体的着丝点整齐排列在各个细胞的赤道板上。'
            },
            { 
                name: '减数分裂Ⅱ-后期', 
                shortName: 'Anaphase II',
                desc: '姐妹分离',
                info: '着丝点分裂，姐妹染色单体分离，向两极移动。'
            },
            { 
                name: '减数分裂Ⅱ-末期', 
                shortName: 'Telophase II',
                desc: '形成配子',
                info: '染色体到达两极，核膜重建，细胞缢裂。最终形成4个配子细胞，染色体数目为体细胞的一半。'
            }
        ];

        // ==================== 阶段状态管理 ====================
        let phaseStates = {
            nucleusVisible: true,      // 核膜可见
            nucleusOpacity: 0.4,       // 核膜透明度
            cellPinching: 0,           // 细胞缢裂程度 0-1
            chromosomeState: 'dispersed', // dispersed, condensed, aligned, separating, arrived
            homologPairing: false,      // 同源染色体配对（减数分裂）
            splitting: false,           // 是否在分裂中
            poles: { top: [], bottom: [] } // 两极的染色体
        };

        // ==================== Three.js 场景 ====================
        let scene, camera, renderer, controls;
        let cell, nucleus, chromosomes = [], spindleFibers = [], centrioles = [];
        let daughterCells = []; // 子细胞（胞质分裂后）
        let currentPhase = 0;
        let isPlaying = false;
        let animationSpeed = 1;
        let divisionType = 'mitosis';
        let animationProgress = 0;
        let transitionProgress = 1; // 阶段过渡进度 0-1
        let previousPhase = 0;

        // 初始化场景
        function init() {
            try {
            const container = document.getElementById('canvas-container');
            
            if (!container) {
                console.error('找不到 canvas-container 元素');
                return;
            }
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            // 相机
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.insertBefore(renderer.domElement, container.firstChild);
            
            // 灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x667eea, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);
            
            // 创建细胞
            createCell();
            
            // 更新阶段列表
            updatePhaseList();
            
            // 鼠标控制
            setupMouseControls();
            
            // 窗口大小变化
            window.addEventListener('resize', onWindowResize);
            
            // 开始渲染
            animate();
            } catch (error) {
                console.error('3D初始化失败:', error);
                container.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#fff;font-family:sans-serif;text-align:center;"><div><h2>⚠️ 3D渲染初始化失败</h2><p>' + error.message + '</p><p>请尝试使用 Chrome 或 Firefox 最新版本</p></div></div>';
            }
        }

        // 创建细胞
        function createCell() {
            // 清除旧对象
            clearScene();
            
            // 更新阶段状态
            updatePhaseState();
            
            // 细胞膜 - 根据阶段变化
            const cellGeometry = new THREE.SphereGeometry(4, 64, 64);
            const cellMaterial = new THREE.MeshPhongMaterial({
                color: 0x66cc66,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide
            });
            cell = new THREE.Mesh(cellGeometry, cellMaterial);
            scene.add(cell);
            
            // 细胞膜线框
            const wireframe = new THREE.LineSegments(
                new THREE.WireframeGeometry(cellGeometry),
                new THREE.LineBasicMaterial({ color: 0x66cc66, transparent: true, opacity: 0.3 })
            );
            cell.add(wireframe);
            
            // 细胞核 - 根据阶段透明度变化
            const nucleusGeometry = new THREE.SphereGeometry(1.8, 32, 32);
            const nucleusMaterial = new THREE.MeshPhongMaterial({
                color: 0xffcc66,
                transparent: true,
                opacity: phaseStates.nucleusOpacity || 0.4
            });
            nucleus = new THREE.Mesh(nucleusGeometry, nucleusMaterial);
            nucleus.visible = phaseStates.nucleusVisible;
            scene.add(nucleus);
            
            // 核膜线框
            const nucleusWireframe = new THREE.LineSegments(
                new THREE.WireframeGeometry(nucleusGeometry),
                new THREE.LineBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.5 })
            );
            nucleusWireframe.visible = phaseStates.nucleusVisible;
            nucleus.add(nucleusWireframe);
            
            // 中心粒 - 位置根据阶段变化
            createCentrioles();
            
            // 创建染色体（根据阶段）
            updateChromosomes();
        }

        // 创建中心粒
        function createCentrioles() {
            centrioles = [];
            const centrioleGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.5, 8);
            const centrioleMaterial = new THREE.MeshPhongMaterial({ color: 0x9999ff });
            
            if (divisionType === 'meiosis' && currentPhase >= 5 && currentPhase <= 4) {
                // 减数分裂II和后期前的特殊位置
                centrioles = [];
            } else if (divisionType === 'meiosis' && currentPhase >= 3) {
                // 减数分裂I后期：两对中心粒
                const positions = [
                    [-3, 0, -2], [-3, 0, 2], [3, 0, -2], [3, 0, 2]
                ];
                positions.forEach(pos => {
                    const centriole = new THREE.Mesh(centrioleGeometry, centrioleMaterial);
                    centriole.position.set(...pos);
                    centriole.rotation.x = Math.PI / 2;
                    centrioles.push(centriole);
                    scene.add(centriole);
                });
            } else if (currentPhase >= 3) {
                // 有丝分裂后期/末期：中心粒在两极
                const positions = [[0, 0, -3], [0, 0, 3]];
                positions.forEach(pos => {
                    const centriole = new THREE.Mesh(centrioleGeometry, centrioleMaterial);
                    centriole.position.set(...pos);
                    centriole.rotation.x = Math.PI / 2;
                    centrioles.push(centriole);
                    scene.add(centriole);
                });
            } else {
                // 前期和中期：中心粒在细胞两极
                const positions = [[0, 0, -3], [0, 0, 3]];
                positions.forEach(pos => {
                    const centriole = new THREE.Mesh(centrioleGeometry, centrioleMaterial);
                    centriole.position.set(...pos);
                    centriole.rotation.x = Math.PI / 2;
                    centrioles.push(centriole);
                    scene.add(centriole);
                });
            }
        }

        // 更新染色体 - 根据各时期特点
        function updateChromosomes() {
            // 清除旧染色体
            chromosomes.forEach(chrom => scene.remove(chrom));
            chromosomes = [];
            
            // 清除子细胞
            daughterCells.forEach(cell => scene.remove(cell));
            daughterCells = [];
            
            // 根据分裂类型和阶段确定染色体数量
            let chromosomeCount = 4; // 默认4对染色体
            let isMeiosis = divisionType === 'meiosis';
            let isMeiosisII = isMeiosis && currentPhase >= 5;
            
            // 更新阶段状态
            updatePhaseState();
            
            // 创建染色体
            for (let i = 0; i < chromosomeCount; i++) {
                const chrom = createChromosomeForPhase(i, chromosomeCount);
                chromosomes.push(chrom);
                scene.add(chrom);
            }
            
            updateSpindleFibers();
        }

        // 根据当前阶段更新状态
        function updatePhaseState() {
            const phases = divisionType === 'mitosis' ? mitosisPhases : meiosisPhases;
            const phase = phases[currentPhase];
            
            // 重置状态
            phaseStates.nucleusVisible = true;
            phaseStates.cellPinching = 0;
            phaseStates.splitting = false;
            phaseStates.homologPairing = false;
            
            if (divisionType === 'mitosis') {
                switch(currentPhase) {
                    case 0: // 间期
                        phaseStates.nucleusOpacity = 0.4;
                        phaseStates.chromosomeState = 'dispersed';
                        break;
                    case 1: // 前期
                        phaseStates.nucleusOpacity = 0.2;
                        phaseStates.nucleusVisible = true;
                        phaseStates.chromosomeState = 'condensing';
                        break;
                    case 2: // 中期
                        phaseStates.nucleusVisible = false;
                        phaseStates.chromosomeState = 'aligned';
                        break;
                    case 3: // 后期
                        phaseStates.nucleusVisible = false;
                        phaseStates.chromosomeState = 'separating';
                        break;
                    case 4: // 末期
                        phaseStates.nucleusVisible = true;
                        phaseStates.nucleusOpacity = 0.2;
                        phaseStates.chromosomeState = 'arrived';
                        break;
                    case 5: // 胞质分裂
                        phaseStates.nucleusVisible = true;
                        phaseStates.nucleusOpacity = 0.4;
                        phaseStates.cellPinching = 0.8;
                        phaseStates.splitting = true;
                        phaseStates.chromosomeState = 'arrived';
                        break;
                }
            } else {
                // 减数分裂
                switch(currentPhase) {
                    case 0: // 间期
                        phaseStates.nucleusOpacity = 0.4;
                        phaseStates.chromosomeState = 'dispersed';
                        phaseStates.homologPairing = false;
                        break;
                    case 1: // 减数分裂I-前期（重点：同源染色体配对形成四分体）
                        phaseStates.nucleusOpacity = 0.15;
                        phaseStates.nucleusVisible = true;
                        phaseStates.chromosomeState = 'condensing';
                        phaseStates.homologPairing = true;
                        break;
                    case 2: // 减数分裂I-中期（四分体排列在赤道板）
                        phaseStates.nucleusVisible = false;
                        phaseStates.chromosomeState = 'aligned';
                        phaseStates.homologPairing = true;
                        break;
                    case 3: // 减数分裂I-后期（同源染色体分离）
                        phaseStates.nucleusVisible = false;
                        phaseStates.chromosomeState = 'separating';
                        phaseStates.homologPairing = true;
                        break;
                    case 4: // 减数分裂I-末期（形成两个次级母细胞）
                        phaseStates.nucleusVisible = true;
                        phaseStates.nucleusOpacity = 0.4;
                        phaseStates.cellPinching = 0.9;
                        phaseStates.splitting = true;
                        phaseStates.homologPairing = false;
                        break;
                    case 5: // 减数分裂II-前期
                        phaseStates.nucleusOpacity = 0.2;
                        phaseStates.nucleusVisible = true;
                        phaseStates.chromosomeState = 'condensing';
                        phaseStates.homologPairing = false;
                        break;
                    case 6: // 减数分裂II-中期（着丝点排列）
                        phaseStates.nucleusVisible = false;
                        phaseStates.chromosomeState = 'aligned';
                        break;
                    case 7: // 减数分裂II-后期（姐妹染色单体分离）
                        phaseStates.nucleusVisible = false;
                        phaseStates.chromosomeState = 'separating';
                        break;
                    case 8: // 减数分裂II-末期（形成4个配子）
                        phaseStates.nucleusVisible = true;
                        phaseStates.nucleusOpacity = 0.4;
                        phaseStates.cellPinching = 0.9;
                        phaseStates.splitting = true;
                        phaseStates.chromosomeState = 'arrived';
                        break;
                }
            }
        }

        // 根据阶段创建染色体
        function createChromosomeForPhase(index, totalCount) {
            const group = new THREE.Group();
            group.userData = { index: index };
            
            // 染色体颜色 - 用不同颜色区分同源染色体
            const colors = [0xe74c3c, 0x3498db, 0x2ecc71, 0x9b59b6];
            const color = colors[index % colors.length];
            const chromMaterial = new THREE.MeshPhongMaterial({ color: color });
            
            // 根据状态确定染色体形态
            let length = 0.3; // 默认短小（染色质状态）
            let radius = 0.08;
            let pairingOffset = 0;
            
            switch(phaseStates.chromosomeState) {
                case 'dispersed':
                    // 间期：染色质丝状
                    length = 0.4;
                    radius = 0.05;
                    break;
                case 'condensing':
                    // 前期：开始凝缩
                    length = 0.8 + Math.sin(transitionProgress * Math.PI) * 0.4;
                    break;
                case 'aligned':
                    // 中期：完全凝缩，整齐排列在赤道板
                    length = 1.2;
                    break;
                case 'separating':
                    // 后期/减数I后期：正在分离
                    length = 1.0;
                    break;
                case 'arrived':
                    // 末期：到达两极
                    length = 0.8;
                    break;
            }
            
            // 减数分裂同源染色体配对
            if (phaseStates.homologPairing && divisionType === 'meiosis') {
                // 创建同源染色体对（四分体）
                const homologGroup = new THREE.Group();
                
                // 第一条（父本来源）
                const arm1a = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, length * 0.45, 8),
                    chromMaterial
                );
                arm1a.rotation.z = Math.PI / 4;
                
                const arm1b = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, length * 0.45, 8),
                    chromMaterial
                );
                arm1b.rotation.z = -Math.PI / 4;
                
                const chromatid1 = new THREE.Group();
                chromatid1.add(arm1a);
                chromatid1.add(arm1b);
                homologGroup.add(chromatid1);
                
                // 第二条（母本来源）- 配对的同源染色体
                const homologMaterial = new THREE.MeshPhongMaterial({ color: 0xf39c12 }); // 橙黄色区分
                const arm2a = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, length * 0.45, 8),
                    homologMaterial
                );
                arm2a.rotation.z = -Math.PI / 4;
                arm2a.position.x = 0.5;
                
                const arm2b = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, length * 0.45, 8),
                    homologMaterial
                );
                arm2b.rotation.z = Math.PI / 4;
                arm2b.position.x = 0.5;
                
                const chromatid2 = new THREE.Group();
                chromatid2.add(arm2a);
                chromatid2.add(arm2b);
                homologGroup.add(chromatid2);
                
                // 交叉互换连接（联会复合体）
                const crossingPoints = [];
                const crossCount = 2;
                for (let c = 0; c < crossCount; c++) {
                    const y = (c / (crossCount - 1) - 0.5) * length * 0.5;
                    crossingPoints.push(new THREE.Vector3(0.25, y, 0));
                }
                const crossGeometry = new THREE.BufferGeometry().setFromPoints(crossingPoints);
                const crossLine = new THREE.Line(crossGeometry, 
                    new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 }));
                homologGroup.add(crossLine);
                
                // 四分体连接线
                const tetradGeometry = new THREE.BufferGeometry();
                const tetradPoints = [
                    new THREE.Vector3(0, -length * 0.3, 0),
                    new THREE.Vector3(0, length * 0.3, 0)
                ];
                tetradGeometry.setFromPoints(tetradPoints);
                const tetradLine = new THREE.Line(tetradGeometry,
                    new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5 }));
                homologGroup.add(tetradLine);
                
                group.add(homologGroup);
            } else {
                // 普通染色体（X形，姐妹染色单体）
                const arm1 = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, length * 0.45, 8),
                    chromMaterial
                );
                arm1.rotation.z = Math.PI / 4;
                
                const arm2 = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, length * 0.45, 8),
                    chromMaterial
                );
                arm2.rotation.z = -Math.PI / 4;
                
                group.add(arm1);
                group.add(arm2);
                
                // 减数分裂II：只有一条染色体（姐妹染色单体未分离状态）
                if (divisionType === 'meiosis' && currentPhase >= 5 && currentPhase < 7) {
                    // 显示着丝点
                    const centromere = new THREE.SphereGeometry(0.1, 8, 8);
                    const centromereMesh = new THREE.Mesh(centromere,
                        new THREE.MeshPhongMaterial({ color: 0xffd700 }));
                    group.add(centromereMesh);
                }
            }
            
            // 根据阶段确定位置
            setChromosomePosition(group, index, totalCount);
            
            return group;
        }

        // 设置染色体位置
        function setChromosomePosition(group, index, totalCount) {
            const angle = (index / totalCount) * Math.PI * 2;
            const horizontalAngle = angle;
            
            // 有丝分裂位置变化
            if (divisionType === 'mitosis') {
                switch(currentPhase) {
                    case 0: // 间期：分散在核内
                        const radius = 0.6 + Math.random() * 0.3;
                        group.position.set(
                            Math.cos(horizontalAngle) * radius,
                            (Math.random() - 0.5) * 0.5,
                            Math.sin(horizontalAngle) * radius * 0.3
                        );
                        group.rotation.set(
                            Math.random() * Math.PI,
                            Math.random() * Math.PI,
                            Math.random() * Math.PI
                        );
                        break;
                    case 1: // 前期：向核膜边缘移动，开始凝缩
                        group.position.set(
                            Math.cos(horizontalAngle) * 1.0,
                            (Math.random() - 0.5) * 0.8,
                            Math.sin(horizontalAngle) * 0.5
                        );
                        group.rotation.set(0, horizontalAngle, 0);
                        break;
                    case 2: // 中期：整齐排列在赤道板上
                        group.position.set(
                            Math.cos(horizontalAngle) * 1.8,
                            0,
                            Math.sin(horizontalAngle) * 0.3
                        );
                        group.rotation.set(Math.PI / 2, 0, horizontalAngle);
                        break;
                    case 3: // 后期：分离向两极移动
                        const separation = transitionProgress;
                        const direction = index % 2 === 0 ? 1 : -1;
                        group.position.set(
                            direction * (2 + separation * 2),
                            (Math.random() - 0.5) * 0.5,
                            (Math.random() - 0.5) * 0.3
                        );
                        group.rotation.set(0, direction * horizontalAngle, 0);
                        break;
                    case 4: // 末期：到达两极
                        const finalDirection = index % 2 === 0 ? 1 : -1;
                        group.position.set(
                            finalDirection * 3.0,
                            (Math.random() - 0.5) * 0.3,
                            (Math.random() - 0.5) * 0.2
                        );
                        group.rotation.set(
                            Math.random() * 0.5,
                            Math.random() * Math.PI,
                            Math.random() * 0.5
                        );
                        break;
                    case 5: // 胞质分裂：两极各有完整的染色体组
                        const cellDirection = index % 2 === 0 ? 1 : -1;
                        group.position.set(
                            cellDirection * (3.0 + (cellDirection > 0 ? 0 : phaseStates.cellPinching * 1.5)),
                            (Math.random() - 0.5) * 0.3,
                            (Math.random() - 0.5) * 0.2
                        );
                        break;
                }
            } else {
                // 减数分裂位置变化
                switch(currentPhase) {
                    case 0: // 间期：同源染色体分散
                        group.position.set(
                            Math.cos(horizontalAngle) * 0.7,
                            (Math.random() - 0.5) * 0.4,
                            Math.sin(horizontalAngle) * 0.3
                        );
                        break;
                    case 1: // 减数I-前期：同源染色体配对
                        group.position.set(
                            Math.cos(horizontalAngle) * 1.2,
                            0,
                            Math.sin(horizontalAngle) * 0.4
                        );
                        break;
                    case 2: // 减数I-中期：四分体排列
                        group.position.set(
                            Math.cos(horizontalAngle) * 1.8,
                            0,
                            Math.sin(horizontalAngle) * 0.2
                        );
                        break;
                    case 3: // 减数I-后期：同源染色体分离（不分离姐妹染色单体）
                        const meiosisDirection = index % 2 === 0 ? 1 : -1;
                        group.position.set(
                            meiosisDirection * (2 + transitionProgress * 1.5),
                            (Math.random() - 0.5) * 0.4,
                            (Math.random() - 0.5) * 0.2
                        );
                        break;
                    case 4: // 减数I-末期：形成两个次级母细胞
                        const meiosisIDirection = index % 2 === 0 ? 1 : -1;
                        group.position.set(
                            meiosisIDirection * 3.2,
                            (Math.random() - 0.5) * 0.3,
                            (Math.random() - 0.5) * 0.2
                        );
                        break;
                    case 5: // 减数II-前期
                        group.position.set(
                            Math.cos(horizontalAngle) * 1.0,
                            (Math.random() - 0.5) * 0.5,
                            Math.sin(horizontalAngle) * 0.3
                        );
                        break;
                    case 6: // 减数II-中期
                        group.position.set(
                            Math.cos(horizontalAngle) * 1.5,
                            0,
                            Math.sin(horizontalAngle) * 0.2
                        );
                        break;
                    case 7: // 减数II-后期：姐妹染色单体分离
                        const meiosisIIDirection = index % 2 === 0 ? 1 : -1;
                        group.position.set(
                            meiosisIIDirection * (1.5 + transitionProgress * 1.2),
                            (Math.random() - 0.5) * 0.3,
                            (Math.random() - 0.5) * 0.2
                        );
                        break;
                    case 8: // 减数II-末期：形成4个配子
                        // 分成4个象限
                        const quadrant = index % 4;
                        const qAngle = (quadrant / 4) * Math.PI * 2;
                        group.position.set(
                            Math.cos(qAngle) * 2.5,
                            (Math.random() - 0.5) * 0.2,
                            Math.sin(qAngle) * 0.2
                        );
                        break;
                }
            }
        }

        // 更新纺锤丝
        function updateSpindleFibers() {
            // 清除旧纺锤丝
            spindleFibers.forEach(fiber => scene.remove(fiber));
            spindleFibers = [];
            
            // 间期无纺锤丝
            if (currentPhase === 0) return;
            
            const fiberMaterial = new THREE.LineBasicMaterial({ 
                color: 0x3498db, 
                transparent: true, 
                opacity: 0.5 
            });
            
            // 减数分裂II时只有一个细胞，中心粒在中心
            // 其他情况中心粒在两极
            let centriolePositions = [];
            
            if (divisionType === 'meiosis' && currentPhase >= 5) {
                // 减数分裂II：中心粒在细胞两端
                centriolePositions = [
                    new THREE.Vector3(0, 0, -2.5),
                    new THREE.Vector3(0, 0, 2.5)
                ];
            } else if (divisionType === 'meiosis' && currentPhase >= 3) {
                // 减数分裂I后期：两组纺锤体
                centriolePositions = [
                    new THREE.Vector3(-3, 0, -2),
                    new THREE.Vector3(-3, 0, 2),
                    new THREE.Vector3(3, 0, -2),
                    new THREE.Vector3(3, 0, 2)
                ];
            } else {
                // 有丝分裂和减数分裂I前期/中期
                centriolePositions = [
                    new THREE.Vector3(0, 0, -3),
                    new THREE.Vector3(0, 0, 3)
                ];
            }
            
            // 为每个染色体绘制纺锤丝
            chromosomes.forEach((chrom, i) => {
                if (phaseStates.chromosomeState === 'aligned') {
                    // 中期：从两极到染色体着丝点
                    centriolePositions.forEach(pos => {
                        const points = [
                            pos.clone(),
                            chrom.position.clone()
                        ];
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const fiber = new THREE.Line(geometry, fiberMaterial);
                        spindleFibers.push(fiber);
                        scene.add(fiber);
                    });
                } else if (phaseStates.chromosomeState === 'separating') {
                    // 后期：牵引染色体向极移动
                    const direction = chrom.position.x > 0 ? 1 : -1;
                    centriolePositions.forEach(pos => {
                        if ((direction > 0 && pos.x > 0) || (direction < 0 && pos.x < 0)) {
                            const points = [
                                pos.clone(),
                                chrom.position.clone()
                            ];
                            const geometry = new THREE.BufferGeometry().setFromPoints(points);
                            const fiber = new THREE.Line(geometry, fiberMaterial);
                            spindleFibers.push(fiber);
                            scene.add(fiber);
                        }
                    });
                }
            });
            
            // 极间纺锤丝（后期和末期）
            if (phaseStates.chromosomeState === 'separating' || phaseStates.chromosomeState === 'arrived') {
                const polarFiberMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x3498db, 
                    transparent: true, 
                    opacity: 0.3 
                });
                
                if (divisionType === 'meiosis' && currentPhase >= 3 && currentPhase < 5) {
                    // 减数分裂I：两组极间纤维
                    [-3, 3].forEach(x => {
                        const points = [
                            new THREE.Vector3(x, 0, -2),
                            new THREE.Vector3(x, 0, 2)
                        ];
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const fiber = new THREE.Line(geometry, polarFiberMaterial);
                        spindleFibers.push(fiber);
                        scene.add(fiber);
                    });
                } else if (divisionType !== 'meiosis' || currentPhase >= 5) {
                    // 有丝分裂或减数分裂II
                    const points = [
                        new THREE.Vector3(0, 0, -3),
                        new THREE.Vector3(0, 0, 3)
                    ];
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const fiber = new THREE.Line(geometry, polarFiberMaterial);
                    spindleFibers.push(fiber);
                    scene.add(fiber);
                }
            }
        }

        // 清除场景
        function clearScene() {
            if (cell) scene.remove(cell);
            if (nucleus) scene.remove(nucleus);
            chromosomes.forEach(chrom => scene.remove(chrom));
            chromosomes = [];
            spindleFibers.forEach(fiber => scene.remove(fiber));
            spindleFibers = [];
            centrioles.forEach(cent => scene.remove(cent));
            centrioles = [];
        }

        // 鼠标控制
        function setupMouseControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let cameraAngle = { theta: 0, phi: Math.PI / 4 };
            let cameraDistance = 12;
            
            const container = renderer.domElement;
            
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                cameraAngle.theta -= deltaX * 0.01;
                cameraAngle.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraAngle.phi + deltaY * 0.01));
                
                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            container.addEventListener('mouseup', () => isDragging = false);
            container.addEventListener('mouseleave', () => isDragging = false);
            
            // 滚轮缩放
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                cameraDistance = Math.max(5, Math.min(20, cameraDistance + e.deltaY * 0.01));
                updateCameraPosition();
            });
            
            function updateCameraPosition() {
                camera.position.x = cameraDistance * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
                camera.position.y = cameraDistance * Math.cos(cameraAngle.phi);
                camera.position.z = cameraDistance * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
                camera.lookAt(0, 0, 0);
            }
            
            // 存储控制状态供视角预设使用
            window.cameraControl = { theta: cameraAngle.theta, phi: cameraAngle.phi, distance: cameraDistance, update: updateCameraPosition };
        }

        // 设置分裂类型
        function setDivisionType(type) {
            divisionType = type;
            currentPhase = 0;
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶ 播放';
            
            // 更新按钮状态
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 更新阶段列表
            updatePhaseList();
            
            // 重建细胞
            createCell();
            
            // 更新进度
            updateProgress();
        }

        // 更新阶段列表
        function updatePhaseList() {
            const phases = divisionType === 'mitosis' ? mitosisPhases : meiosisPhases;
            const title = divisionType === 'mitosis' ? '有丝分裂阶段' : '减数分裂阶段';
            document.getElementById('phase-title').textContent = title;
            
            const list = document.getElementById('phase-list');
            list.innerHTML = phases.map((phase, i) => `
                <div class="phase-item ${i === currentPhase ? 'active' : ''}" onclick="goToPhase(${i})">
                    <div class="phase-num">${i + 1}</div>
                    <div class="phase-info">
                        <div class="phase-name">${phase.name}</div>
                        <div class="phase-desc">${phase.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        // 跳转到指定阶段
        function goToPhase(phase) {
            previousPhase = currentPhase;
            currentPhase = phase;
            animationProgress = 0;
            transitionProgress = 1; // 立即显示目标阶段
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶ 播放';
            
            updatePhaseState();
            updatePhaseList();
            createCell();
            updateProgress();
            updateInfoPanel();
        }

        // 重置动画
        function resetAnimation() {
            currentPhase = 0;
            previousPhase = 0;
            animationProgress = 0;
            transitionProgress = 1;
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶ 播放';
            
            updatePhaseList();
            createCell();
            updateProgress();
            updateInfoPanel();
        }

        // 播放/暂停
        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
        }

        // 设置速度
        function setSpeed(value) {
            animationSpeed = parseFloat(value);
        }

        // 设置视角
        function setCameraView(view) {
            const ctrl = window.cameraControl;
            switch(view) {
                case 'front':
                    ctrl.theta = 0; ctrl.phi = Math.PI / 2;
                    break;
                case 'top':
                    ctrl.theta = 0; ctrl.phi = 0.1;
                    break;
                case 'side':
                    ctrl.theta = Math.PI / 2; ctrl.phi = Math.PI / 2;
                    break;
                case 'iso':
                    ctrl.theta = Math.PI / 4; ctrl.phi = Math.PI / 3;
                    break;
            }
            ctrl.update();
        }

        // 更新进度
        function updateProgress() {
            const phases = divisionType === 'mitosis' ? mitosisPhases : meiosisPhases;
            const percent = ((currentPhase + animationProgress) / phases.length) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = Math.round(percent) + '%';
            document.getElementById('currentPhaseName').textContent = phases[currentPhase].name;
        }

        // 更新信息面板
        function updateInfoPanel() {
            const phases = divisionType === 'mitosis' ? mitosisPhases : meiosisPhases;
            const phase = phases[currentPhase];
            document.getElementById('infoTitle').textContent = phase.name;
            document.getElementById('infoText').textContent = phase.info;
        }

        // 隐藏信息面板
        function hideInfo() {
            document.getElementById('infoPanel').style.display = 'none';
        }

        // 窗口大小变化
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (isPlaying) {
                // 阶段内过渡动画
                if (transitionProgress < 1) {
                    transitionProgress += 0.01 * animationSpeed;
                    transitionProgress = Math.min(1, transitionProgress);
                    
                    // 更新染色体位置（平滑过渡）
                    updateChromosomePositions();
                    
                    // 更新核膜透明度
                    if (nucleus && nucleus.material) {
                        const targetOpacity = phaseStates.nucleusVisible ? 
                            (phaseStates.nucleusOpacity || 0.4) : 0;
                        nucleus.material.opacity += (targetOpacity - nucleus.material.opacity) * 0.05;
                        nucleus.visible = nucleus.material.opacity > 0.01;
                        
                        if (nucleus.children[0]) {
                            nucleus.children[0].visible = nucleus.visible;
                        }
                    }
                    
                    // 更新细胞膜（胞质分裂）
                    updateCellShape();
                }
                
                // 阶段切换
                animationProgress += 0.005 * animationSpeed;
                
                if (animationProgress >= 1) {
                    animationProgress = 0;
                    transitionProgress = 0;
                    previousPhase = currentPhase;
                    const phases = divisionType === 'mitosis' ? mitosisPhases.length : meiosisPhases.length;
                    currentPhase = (currentPhase + 1) % phases;
                    
                    // 胞质分裂后重新创建场景
                    if (currentPhase === 0) {
                        createCell();
                    } else {
                        updatePhaseState();
                        createCell();
                    }
                    
                    updatePhaseList();
                    updateInfoPanel();
                }
                
                updateProgress();
            }
            
            // 轻微动画
            if (cell) {
                cell.rotation.y += 0.002;
            }
            
            renderer.render(scene, camera);
        }

        // 更新染色体位置（平滑过渡）
        function updateChromosomePositions() {
            chromosomes.forEach((group, i) => {
                // 根据当前阶段和过渡进度更新位置
                setChromosomePosition(group, group.userData.index, chromosomes.length);
            });
        }

        // 更新细胞形态（胞质分裂缢裂效果）
        function updateCellShape() {
            if (!cell) return;
            
            const pinchAmount = phaseStates.cellPinching;
            
            if (pinchAmount > 0) {
                // 创建缢裂效果 - 修改细胞膜几何体
                // 由于Three.js球体几何体不能直接变形，我们通过缩放来模拟
                const scale = 1 - pinchAmount * 0.15;
                cell.scale.set(scale, 1 - pinchAmount * 0.25, scale);
            } else {
                cell.scale.set(1, 1, 1);
            }
        }

        // 启动
        init();
    </script>
</body>
</html>
