  <!-- 底部按钮 -->
  <rect x="20" y="185" width="80" height="30" fill="#3b82f6" rx="6"/>
  <text x="60" y="205" fill="white" font-size="10" text-anchor="middle">📊 统计分析</text>
  
  <rect x="110" y="185" width="80" height="30" fill="#22c55e" rx="6"/>
