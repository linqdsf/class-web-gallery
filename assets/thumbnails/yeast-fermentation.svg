<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="yeastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5af19"/>
      <stop offset="100%" style="stop-color:#f12711"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="15"/>
  
  <!-- 标题 -->
  <text x="200" y="40" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Microsoft YaHei">酵母菌发酵模拟器</text>
  
  <!-- 发酵罐/烧杯 -->
  <g transform="translate(200, 150)">
    <!-- 烧杯主体 -->
    <path d="M-60,60 L-50,-40 Q-50,-60 -30,-60 L30,-60 Q50,-60 50,-40 L60,60 Z" 
          fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    
    <!-- 液体 -->
    <path d="M-55,50 L-48,-35 Q-48,-50 -30,-50 L30,-50 Q48,-50 48,-35 L55,50 Z" 
          fill="rgba(139,90,43,0.6)"/>
    
    <!-- 气泡 -->
    <circle cx="-20" cy="20" r="8" fill="rgba(255,255,255,0.4)">
      <animate attributeName="cy" values="20;-30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="30" r="6" fill="rgba(255,255,255,0.3)">
      <animate attributeName="cy" values="30;-40" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="10" r="5" fill="rgba(255,255,255,0.35)">
      <animate attributeName="cy" values="10;-50" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 酵母菌细胞 -->
    <ellipse cx="-15" cy="40" rx="8" ry="7" fill="url(#yeastGrad)"/>
    <ellipse cx="15" cy="35" rx="7" ry="6" fill="url(#yeastGrad)"/>
    <ellipse cx="5" cy="50" rx="6" ry="5" fill="url(#yeastGrad)"/>
    <ellipse cx="-30" cy="25" rx="5" ry="5" fill="url(#yeastGrad)"/>
    <ellipse cx="25" cy="45" rx="6" ry="5" fill="url(#yeastGrad)"/>
  </g>
  
  <!-- 左侧标签 -->
  <g transform="translate(30, 120)">
    <rect x="-15" y="-15" width="80" height="30" rx="5" fill="rgba(76,175,80,0.8)"/>
    <text x="25" y="5" text-anchor="middle" fill="white" font-size="12" font-family="Microsoft YaHei">有氧呼吸</text>
  </g>
  
  <!-- 右侧标签 -->
  <g transform="translate(290, 120)">
    <rect x="-15" y="-15" width="80" height="30" rx="5" fill="rgba(244,67,54,0.8)"/>
    <text x="25" y="5" text-anchor="middle" fill="white" font-size="12" font-family="Microsoft YaHei">无氧呼吸</text>
  </g>
  
  <!-- 底部箭头 -->
  <g transform="translate(200, 250)">
    <path d="M-120,0 L-100,0 M-105,-5 L-100,0 L-105,5" stroke="white" stroke-width="2" fill="none"/>
    <text x="-110" y="20" fill="rgba(255,255,255,0.8)" font-size="10" font-family="Microsoft YaHei">CO₂</text>
    
    <path d="M100,0 L120,0 M115,-5 L120,0 L115,5" stroke="white" stroke-width="2" fill="none"/>
    <text x="110" y="20" fill="rgba(255,255,255,0.8)" font-size="10" font-family="Microsoft YaHei">酒精</text>
  </g>
  
  <!-- 版本标签 -->
  <g transform="translate(350, 280)">
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-family="Microsoft YaHei">v1.0</text>
  </g>
</svg>
